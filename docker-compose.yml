# Local runtime, fully containerized: Postgres + API + Next.js web, one command.
# `docker compose up --build`. Postgres persists to a named volume; API and web
# source are bind-mounted for live reload. Override host ports with DB_PORT / API_PORT / WEB_PORT.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
      POSTGRES_DB: tickets
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+asyncpg://tickets:tickets@db:5432/tickets
      CORS_ORIGINS: http://localhost:3000
    command: >
      sh -c "uv run --no-dev alembic upgrade head &&
             uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./api:/app          # live source for reload
      - /app/.venv          # mask host venv; the image venv lives at /opt/venv
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      target: deps
    environment:
      API_BASE_URL: http://api:8000
    command: sh -c "pnpm exec next dev --hostname 0.0.0.0 --port 3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  pgdata:
